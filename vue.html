<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue 3 Form and Table Example</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
        }

        form {
            margin-bottom: 2rem;
        }

        input,
        select,
        textarea {
            display: block;
            margin: 0.5rem 0 1rem;
            padding: 0.5rem;
            width: 100%;
            max-width: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 0.5rem;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }
    </style>
</head>

<body>
    <div id="app">
        <h2>Vue 3 Form with Dummy API</h2>

        <form @submit.prevent="submitForm">
            <label>
                Name:
                <input type="text" v-model="form.name" required />
            </label>

            <label>
                Email:
                <input type="email" v-model="form.email" required />
            </label>

            <label>
                Role:
                <select v-model="form.role" required>
                    <option disabled value="">Please select one</option>
                    <option>Admin</option>
                    <option>User</option>
                    <option>Guest</option>
                </select>
            </label>

            <label>
                Gender:
                <input type="radio" value="Male" v-model="form.gender" /> Male
                <input type="radio" value="Female" v-model="form.gender" /> Female
            </label>

            <label>
                <input type="checkbox" v-model="form.subscribe" />
                Subscribe to newsletter
            </label>

            <label>
                Bio:
                <textarea v-model="form.bio" rows="3"></textarea>
            </label>

            <label>
                Date of Birth:
                <input type="date" v-model="form.dob" />
            </label>

            <button type="submit">Submit</button>
        </form>

        <h3>Submitted Entries</h3>
        <table v-if="entries.length">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Gender</th>
                    <th>Subscribed</th>
                    <th>DOB</th>
                    <th>Bio</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="(entry, index) in entries" :key="index">
                    <td>{{ index + 1 }}</td>
                    <td>{{ entry.name }}</td>
                    <td>{{ entry.email }}</td>
                    <td>{{ entry.role }}</td>
                    <td>{{ entry.gender }}</td>
                    <td>{{ entry.subscribe ? 'Yes' : 'No' }}</td>
                    <td>{{ entry.dob }}</td>
                    <td>{{ entry.bio }}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const form = ref({
                    name: '',
                    email: '',
                    role: '',
                    gender: '',
                    subscribe: false,
                    bio: '',
                    dob: ''
                });

                const entries = ref([]);

                const submitForm = async () => {
                    // Simulate API call
                    const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(form.value)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        entries.value.push({ ...form.value });

                        // Reset form
                        form.value = {
                            name: '',
                            email: '',
                            role: '',
                            gender: '',
                            subscribe: false,
                            bio: '',
                            dob: ''
                        };
                    } else {
                        alert('Failed to submit form.');
                    }
                };

                return { form, entries, submitForm };
            }
        }).mount('#app');
    </script>
</body>

</html>
